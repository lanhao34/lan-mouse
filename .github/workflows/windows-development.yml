name: Windows development package
on:
  workflow_dispatch:
  push:
    branches: [feature/personal-kvm]
    paths:
      - '.github/workflows/windows-development.yml'
      - 'lan-mouse-gtk/**'
      - 'input-event/**'
      - 'src/**'
      - 'tools/package-windows.py'
      - 'tools/launch-windows.cmd'
      - 'docs/WINDOWS_TEST_BUILD.md'
      - 'Cargo.lock'
permissions:
  contents: read
concurrency:
  group: windows-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native Windows overlay
        shell: pwsh
        run: |
          dotnet publish lan-mouse-gtk/native/windows/EdgeOverlay.csproj -c Release -r win-x64 --self-contained true -o target/windows-edge-overlay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/windows-edge-overlay/edge-overlay.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/windows-edge-overlay/edge-overlay.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ntldd
            make
      - name: Test and build Windows application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          export PKG_CONFIG="$(cygpath -m /ucrt64/bin/pkgconf.exe)"
          export GSETTINGS_SCHEMA_DIR=/ucrt64/share/glib-2.0/schemas
          /ucrt64/bin/rustc --version
          /ucrt64/bin/cargo --version
          /ucrt64/bin/cargo test --workspace --all-features --locked
          /ucrt64/bin/cargo clippy --workspace --all-targets --all-features --locked
          /ucrt64/bin/cargo build --release --locked
          /ucrt64/bin/cargo build --release -p lan-mouse-gtk --example edge-selector --locked
      - name: Assemble portable package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GTK_PREFIX="$(cygpath -m /ucrt64)"
          /ucrt64/bin/python tools/package-windows.py
          cp tools/launch-windows.cmd dist/lan-mouse-windows-x64/Launch.cmd
      - name: Validate package without build-machine DLL paths
        shell: pwsh
        run: |
          $package = (Resolve-Path dist/lan-mouse-windows-x64).Path
          $env:PATH = "$package;$env:SystemRoot\System32;$env:SystemRoot"
          $env:XDG_DATA_DIRS = "$package\share"
          $env:GSETTINGS_SCHEMA_DIR = "$package\share\glib-2.0\schemas"
          $env:GDK_PIXBUF_MODULEDIR = "$package\lib\gdk-pixbuf-2.0\2.10.0\loaders"
          & "$package\gdk-pixbuf-query-loaders.exe" | Out-File -Encoding utf8 "$package\loaders.cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$package\lan-mouse.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$package\native-edge-overlay\edge-overlay.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Loader paths are installation-specific and regenerated by Launch.cmd.
          Remove-Item "$package\loaders.cache"
          Compress-Archive -Path "$package\*" -DestinationPath dist/lan-mouse-windows-x64.zip
          $hash = (Get-FileHash dist/lan-mouse-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  lan-mouse-windows-x64.zip" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: windows-development-package
          path: |
            dist/lan-mouse-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: windows-development-package
          path: release-assets
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="dev-windows-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          gh release create "$tag" release-assets/lan-mouse-windows-x64.zip release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Windows development ${GITHUB_SHA:0:8}" \
            --notes-file docs/WINDOWS_TEST_BUILD.md
